name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LOMOCAM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lomocam-release.jks"
            echo "LOMOCAM_KEYSTORE_FILE=$RUNNER_TEMP/lomocam-release.jks" >> "$GITHUB_ENV"
            echo "Release signing key restored."
          else
            echo "::warning::LOMOCAM_KEYSTORE_BASE64 secret not set - APK will be signed with a throwaway debug key and will NOT update over a properly signed install."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        env:
          LOMOCAM_KEYSTORE_PASSWORD: ${{ secrets.LOMOCAM_KEYSTORE_PASSWORD }}
          LOMOCAM_KEY_ALIAS: ${{ secrets.LOMOCAM_KEY_ALIAS }}
          LOMOCAM_KEY_PASSWORD: ${{ secrets.LOMOCAM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/LomoCam-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LomoCam-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      # A GitHub Release gives a plain APK link you can open straight from the Pixel
      # (artifacts above are zipped and need a desktop browser).
      - name: Publish phone download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" out/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "LomoCam build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Open this page on the Pixel and tap the .apk to install."
